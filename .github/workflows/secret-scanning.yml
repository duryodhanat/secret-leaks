name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BL_IMAGE: ghcr.io/betterleaks/betterleaks:v1.8.1 # pinned v1: v2 drops SARIF

jobs:
  betterleaks:
    name: Betterleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          opts=""
          if [ "$EVENT" = "pull_request" ]; then
            opts="--log-opts=origin/${BASE_REF}..HEAD"
          elif [ "$EVENT" = "push" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            opts="--log-opts=${BEFORE}..${AFTER}"
          fi
          echo "opts=$opts" >> "$GITHUB_OUTPUT"

      - name: Run Betterleaks
        env:
          RANGE_OPTS: ${{ steps.range.outputs.opts }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            "$BL_IMAGE" git . \
              --config .betterleaks.toml \
              --verbose --redact \
              --report-format sarif --report-path betterleaks.sarif \
              --exit-code 1 \
              $RANGE_OPTS

      - name: Upload SARIF to Security tab
        if: >-
          always() && hashFiles('betterleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: betterleaks.sarif
          category: betterleaks

